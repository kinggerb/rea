name: Fetch RE tools cache

# Downloads the external analysis engines that REA drives (Ghidra + JDK 21) and
# ILSpy (for C# decompilation of Unity Mono assemblies) on a GitHub-hosted runner,
# verifies them, splits them into <100 MB chunks and commits them to the orphan
# branch `re-tools-cache`. A sandbox that can only reach github.com can then
# `git clone --branch re-tools-cache --depth 1` and reassemble the archives.

on:
  workflow_dispatch:
  push:
    branches: [arena/af205f49-rea]
    paths: [.github/workflows/fetch-re-tools.yml]

permissions:
  contents: write

concurrency:
  group: fetch-re-tools
  cancel-in-progress: true

env:
  GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
  GHIDRA_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
  CACHE_BRANCH: re-tools-cache

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Prepare workspace
        run: |
          set -euo pipefail
          mkdir -p downloads out
          df -h . | tail -1

      - name: Download Ghidra 12.1.4
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 -o downloads/ghidra_12.1.4_PUBLIC_20260921.zip "$GHIDRA_URL"
          echo "$GHIDRA_SHA256  downloads/ghidra_12.1.4_PUBLIC_20260921.zip" | sha256sum -c -

      - name: Download Temurin JDK 21 (linux x64)
        run: |
          set -euo pipefail
          api='https://api.adoptium.net/v3/assets/latest/21/hotspot?architecture=x64&image_type=jdk&os=linux&vendor=eclipse'
          json=$(curl -fsSL --retry 5 "$api")
          url=$(echo "$json" | jq -r '.[0].binary.package.link')
          sha=$(echo "$json" | jq -r '.[0].binary.package.checksum')
          name=$(echo "$json" | jq -r '.[0].binary.package.name')
          echo "JDK: $name"
          curl -fsSL --retry 5 -o "downloads/$name" "$url"
          echo "$sha  downloads/$name" | sha256sum -c -
          echo "$name" > downloads/JDK_NAME

      - name: Set up .NET SDK (for ILSpy tool install)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Bundle ILSpy (ilspycmd) with a matching .NET runtime
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p ilspy/tool
          dotnet tool install ilspycmd --tool-path ilspy/tool
          # Detect the target framework the tool was built for and fetch that runtime.
          tfm=$(ls -d ilspy/tool/.store/ilspycmd/*/ilspycmd/*/tools/net*/ | sed 's#.*/tools/##; s#/##' | sort -V | tail -1)
          major=${tfm#net}; major=${major%%.*}
          echo "ilspycmd target framework: $tfm -> runtime channel ${major}.0"
          curl -fsSL --retry 5 -o dotnet-install.sh https://dot.net/v1/dotnet-install.sh
          bash dotnet-install.sh --runtime dotnet --channel "${major}.0" --install-dir ilspy/dotnet --no-path
          # Smoke test with the bundled runtime only.
          DOTNET_ROOT="$PWD/ilspy/dotnet" PATH="$PWD/ilspy/dotnet:$PATH" ilspy/tool/ilspycmd --version
          tar -czf downloads/ilspy-bundle-linux-x64.tar.gz ilspy
          ls -la downloads

      - name: Split into <100 MB chunks and write manifest
        run: |
          set -euo pipefail
          cd downloads
          rm -f JDK_NAME
          sha256sum * > ../out/MANIFEST.sha256
          for f in *; do
            split -b 90m -d -a 2 "$f" "../out/$f.part"
          done
          cd ../out
          cat > README.md <<'EOF'
          # RE tools cache

          Generated by `.github/workflows/fetch-re-tools.yml`. Reassemble with:

              for base in $(ls *.part00 | sed 's/\.part00$//'); do cat "$base".part* > "$base"; done
              sha256sum -c MANIFEST.sha256

          Contents: Ghidra 12.1.4 (Apache-2.0), Eclipse Temurin JDK 21 (GPLv2+CE),
          ILSpy ilspycmd + .NET runtime (MIT / MIT). See each project's license.
          EOF
          ls -la
          du -sh .

      - name: Publish to orphan branch
        run: |
          set -euo pipefail
          cd out
          git init -q -b "$CACHE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "RE tools cache: Ghidra 12.1.4, Temurin JDK 21, ILSpy ($(date -u +%Y-%m-%dT%H:%MZ))"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:refs/heads/$CACHE_BRANCH"
          echo "Pushed to https://github.com/${GITHUB_REPOSITORY}/tree/$CACHE_BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
